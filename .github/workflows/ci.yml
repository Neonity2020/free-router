name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            agent/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix frontend
      - run: npm ci --prefix agent --omit=dev
      - run: npm audit --prefix agent --omit=dev --audit-level=high
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path backend/Cargo.toml
      - run: cargo build --locked --manifest-path backend/Cargo.toml
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npm test --prefix agent
      - run: npm run cli:test
      - run: npm run desktop:test
      - run: python3 scripts/smoke_test.py
      - run: python3 scripts/cli_smoke_test.py
      - run: python3 scripts/retry_timeout_test.py
      - run: python3 scripts/cooldown_test.py
