name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag matches version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py --verify-version "$RELEASE_TAG"
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo test --locked --manifest-path backend/Cargo.toml
      - run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path backend/Cargo.toml
      - run: python3 scripts/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          gh release upload "$RELEASE_TAG" release/*.tar.gz release/*.sha256
          gh release edit "$RELEASE_TAG" --draft=false --latest
