[package]
name = "free-router"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["fs", "limit"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
semver = "1"
sha2 = "0.10"

getrandom = "0.2"
